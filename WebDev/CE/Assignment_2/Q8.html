<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border : 2px solid black;
            text-align: center;
            padding : 5px;
            margin : auto;
            border-collapse : collapse;
        }
        td{
            border : 2px solid black;
            height : 80px;
            width : 100px;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td colspan="3">1</td>
            <td rowspan="2">2</td>
        </tr>
        <tr>
            <td rowspan="2">4</td>
            <td colspan="2">5</td>
        </tr>
        <tr >
            <td colspan = "3">3</td>
        </tr>
    </table>
</body>
</html>
