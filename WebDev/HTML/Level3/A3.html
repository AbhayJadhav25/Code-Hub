<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Q3</title>
</head>
<body>
    <form action="/action">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Write your name" name="username"> 
            <br><br>
            <label for="gmail">Email:</label>
            <input type="email" id="gmail" placeholder="Write your email" name="gmail">
        </div>
        <div>
            <label for="message">Message: </label><br>
            <textarea name="message" id="message" name="message"></textarea>
        </div>
        <div>
            <label for="rate">Rate us out of 5:</label> <br>
            <input type="radio" name="rate" value="1">
            <label for="rate">1</label> <br>
            <input type="radio" name="rate" value="2">
            <label for="rate">2</label> <br>
            <input type="radio" name="rate" value="3">
            <label for="rate">3</label><br>
            <input type="radio" name="rate" value="4">
            <label for="rate">4</label><br>
            <input type="radio" name="rate" value="5">
            <label for="rate">5</label>
            <br><br><br>
        </div>
        <button> Send your Message</button>
    </form>
</body>
</html>
