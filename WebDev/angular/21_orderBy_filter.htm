<!DOCTYPE html>
<html>
    <head>
        <script src = "angular.min.js"></script>
    </head>
    <body>
        <div ng-app = 'myApp' ng-controller = 'myCtrl'>
            <ul>
                <li ng-repeat = "person in persons | orderBy : country">
                    {{person.name + ' '+person.country}}
                </li>
            </ul>
        </div>
        <script>
            var app = angular.module('myApp' , [])
            app.controller('myCtrl' , function($scope){
                $scope.persons = [
                    {name : 'Abhay' , country : 'Bharat'} , 
                    {name : 'Aditya' , country : 'USA'} , 
                    {name : 'Om' , country : 'Paris'} , 
                    {name : 'Sai' , country : 'Canada'} 
                ]
            })
        </script>
    </body>
</html>
