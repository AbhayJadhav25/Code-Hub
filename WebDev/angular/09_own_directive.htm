<!DOCTYPE html>
<html>
    <head>
        <script src = "angular.min.js"></script>
    </head>
    <body>
        <div ng-app = 'myApp' user-directive></div>

        <script>
            var app = angular.module('myApp' , [])
            app.directive("userDirective" , function(){
                return {
                    template : "I was made in a directive Constructor!"
                };
            } );
        </script>
    </body>
</html>
